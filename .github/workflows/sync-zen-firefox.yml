name: Follow Zen Firefox and security updates

# GitHub runs scheduled workflows from the repository's default branch.
# This file stays on `dev` so the schedule runs, and the job updates `mine`.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: zen-firefox-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Update mine from Zen
    runs-on: ubuntu-latest
    steps:
      - name: Check out mine
        uses: actions/checkout@v4
        with:
          ref: mine
          fetch-depth: 0

      - name: Apply Firefox and security updates
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: python3 scripts/sync_zen_firefox_updates.py --push
